name: Deploy to develop

on:
  workflow_dispatch:
  push:
    branches:
      - develop
jobs:
  deploy:
    name: Deploy realizado por ${{ github.actor }}
    runs-on: develop
    environment: develop
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Serve frontend
        run: |
          sudo mkdir -p /usr/share/nginx/ekklesias/
          sudo rm -rf /usr/share/nginx/ekklesias/*
          sudo cp -r out/* /usr/share/nginx/ekklesias/
          sudo systemctl reload nginx